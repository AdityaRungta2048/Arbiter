# Full stack: FastAPI service + Streamlit UI. Fully ONLINE — every critic runs
# on a cloud model (OpenAI, Anthropic, Google Gemini), so there is no local model
# runtime to manage. SQLite is a file on a shared named volume (no separate DB
# service needed).
#
# Runs keyless out of the box on the deterministic mock backend; provide API keys
# to light up the real critics. In `auto` mode each critic falls back to mock
# when its key is absent, so the stack always comes up.
#
#   docker compose up --build
#   API  -> http://localhost:8000/docs
#   UI   -> http://localhost:8501

x-arbiter-env: &arbiter-env
  # Spec routing, now fully cloud: accuracy->GPT-4o, logic->Claude,
  # completeness->Gemini, adjudicator->Claude.
  ARBITER_ACCURACY_BACKEND: ${ARBITER_ACCURACY_BACKEND:-openai}
  ARBITER_LOGIC_BACKEND: ${ARBITER_LOGIC_BACKEND:-anthropic}
  ARBITER_COMPLETENESS_BACKEND: ${ARBITER_COMPLETENESS_BACKEND:-gemini}
  ARBITER_ADJUDICATOR_BACKEND: ${ARBITER_ADJUDICATOR_BACKEND:-anthropic}
  ARBITER_BACKEND_MODE: auto
  ARBITER_GEMINI_MODEL: ${ARBITER_GEMINI_MODEL:-gemini-2.0-flash}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
  ARBITER_DB_PATH: /app/data/arbitrations.sqlite
  ARBITER_JSON_DIR: /app/data/arbitrations

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      <<: *arbiter-env
    volumes:
      - data:/app/data

  ui:
    build: .
    depends_on:
      - api
    command:
      ["streamlit", "run", "ui/streamlit_app.py",
       "--server.address=0.0.0.0", "--server.port=8501", "--server.headless=true"]
    ports:
      - "8501:8501"
    environment:
      <<: *arbiter-env
    volumes:
      - data:/app/data

volumes:
  data:
